<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>verble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#15171c;--surface:#1c1f25;--line:#2b2f37;--sub:#5f6573;--text:#e8e4da;--main:#f2a57c;--err:#e2727a}
[data-theme=linen]{--bg:#f3f0e8;--surface:#ebe7dd;--line:#dbd5c8;--sub:#a29b8c;--text:#2c2a26;--main:#2f6e5b;--err:#c2513d}
[data-theme=moss]{--bg:#171c19;--surface:#1e2420;--line:#2b332e;--sub:#617266;--text:#e3e8de;--main:#b7d68c;--err:#e48a76}
[data-theme=dusk]{--bg:#1f1d2b;--surface:#262434;--line:#35314a;--sub:#6a6487;--text:#e7e2f4;--main:#c7a8f4;--err:#f08aa0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',ui-monospace,monospace;min-height:100vh;transition:background .5s,color .5s;-webkit-font-smoothing:antialiased}
::selection{background:var(--main);color:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:26px 28px 22px}

header{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:18px}
.logo{font-family:'Instrument Serif',serif;font-style:italic;font-size:32px;letter-spacing:.2px;line-height:1;user-select:none;padding:0}
.logo i{font-style:normal;color:var(--main)}
.langs{display:flex;gap:4px;font-size:12px;letter-spacing:.06em}
.langs button{color:var(--sub);padding:6px 10px;position:relative;transition:color .2s}
.langs button:hover{color:var(--text)}
.langs button.on{color:var(--text)}
.langs button.on::after{content:'';position:absolute;left:50%;bottom:0;width:4px;height:4px;border-radius:50%;background:var(--main);transform:translateX(-50%)}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 0 24px}
.stage{display:flex;flex-direction:column;align-items:center;width:100%;transition:opacity .18s ease,transform .18s ease}
.stage.out{opacity:0;transform:translateY(6px)}
.kicker .again{color:var(--text);opacity:.7}
.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--main);min-height:14px}
.verb{font-family:'Instrument Serif',serif;font-size:clamp(46px,8vw,72px);line-height:1.05;margin-top:12px;text-align:center}
.gloss{font-size:13px;color:var(--sub);margin-top:8px;min-height:17px;text-align:center}
.row{display:flex;justify-content:center;align-items:baseline;gap:.55ch;margin-top:52px;font-size:clamp(21px,3.4vw,29px);max-width:100%}
.pron{color:var(--sub);white-space:nowrap}
#ans{font:inherit;color:var(--text);background:none;border:0;outline:0;caret-color:var(--main);width:9ch;max-width:70vw;
  padding:0 0 8px;border-bottom:1px solid var(--line);transition:color .2s,border-color .25s,width .12s ease}
#ans:focus{border-bottom-color:var(--sub)}
.row.ok #ans{color:var(--main);border-bottom-color:var(--main)}
.row.bad #ans{color:var(--err);border-bottom-color:var(--err)}
.shake{animation:shake .32s ease}
@keyframes shake{20%{transform:translateX(-5px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}100%{transform:none}}
.feedback{min-height:26px;margin-top:20px;font-size:clamp(15px,2.3vw,18px);color:var(--sub);text-align:center}
.feedback .d{color:var(--text);text-decoration:underline;text-decoration-color:var(--main);text-underline-offset:5px}
.feedback .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-left:12px}

.keys{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:46px}
.keys button{border:1px solid var(--line);border-radius:8px;min-width:38px;padding:6px 8px 5px;color:var(--text);font-size:15px;position:relative;transition:border-color .15s,color .15s}
.keys button sup{position:absolute;top:2px;left:5px;font-size:8px;color:var(--sub)}
.keys button:hover,.keys button.flash{border-color:var(--main);color:var(--main)}

footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-size:12px;color:var(--sub);gap:16px}
.stats{display:flex;gap:18px;user-select:none}
.stats b{color:var(--text);font-weight:400;margin-right:5px;display:inline-block;transition:transform .2s,color .2s}
.stats b.pop{transform:scale(1.2);color:var(--main)}
.hints{display:flex;gap:16px;font-size:11px;transition:opacity .35s}
.hints span b{font-weight:400;color:var(--text)}
.gear{justify-self:end;color:var(--sub);padding:6px 2px;letter-spacing:.06em;transition:color .2s,opacity .35s}
.gear:hover,.gear.on{color:var(--text)}
body.typing .hints,body.typing .gear,body.typing .langs{opacity:.12}

.panel{position:fixed;left:50%;bottom:62px;transform:translate(-50%,10px);width:min(760px,calc(100vw - 32px));background:var(--surface);
  border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s,background .5s;z-index:5}
.panel.open{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.prow{display:grid;grid-template-columns:84px 1fr;align-items:baseline;gap:10px}
.prow>span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid transparent;color:var(--sub);transition:color .15s,border-color .15s}
.chips button:hover{color:var(--text)}
.chips button.on{color:var(--text);border-color:var(--line);background:var(--bg)}
@media (max-width:700px){
  footer{grid-template-columns:1fr auto}.hints{display:none}
  .stats{gap:12px}.prow{grid-template-columns:1fr}.wrap{padding:20px 18px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <button class="logo" id="logo" title="switch mode">verble<i>.</i></button>
      <nav class="langs" id="modes"></nav>
    </div>
    <nav class="langs" id="langs"></nav>
  </header>

  <main>
    <div class="stage" id="stage">
      <div class="kicker" id="tense"></div>
      <div class="verb" id="verb"></div>
      <div class="gloss" id="gloss"></div>
      <div class="row" id="row">
        <span class="pron" id="pron"></span>
        <input id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="your answer">
      </div>
      <div class="feedback" id="fb"></div>
    </div>
    <div class="keys" id="keys"></div>
  </main>

  <footer>
    <div class="stats">
      <span><b id="sStreak">0</b>streak</span>
      <span><b id="sAcc">–</b>acc</span>
      <span><b id="sBest">0</b>best</span>
      <span title="mistakes waiting to come back"><b id="sRev">0</b>to review</span>
    </div>
    <div class="hints"><span><b>enter</b> check</span><span><b>tab</b> reveal</span><span><b>1–9</b> accents</span></div>
    <button class="gear" id="gear">settings</button>
  </footer>
</div>
<div class="panel" id="panel"></div>

<script>
/*ENGINE*/
const lastRep=(s,a,b)=>{const i=s.lastIndexOf(a);return i<0?s:s.slice(0,i)+b+s.slice(i+a.length)};
const alts=s=>s.split('|');
const pick1=a=>a[Math.floor(Math.random()*a.length)];

/* ================= FRENCH ================= */
const FR=(()=>{
const IMP=['ais','ais','ait','ions','iez','aient'],FUT=['ai','as','a','ons','ez','ont'],SUBJ=['e','es','e','ions','iez','ent'];
const IRR={
 'être':{g:'to be',pres:'suis es est sommes êtes sont',imp:'ét',fut:'ser',subj:'sois sois soit soyons soyez soient',pp:'été'},
 'avoir':{g:'to have',pres:'ai as a avons avez ont',fut:'aur',subj:'aie aies ait ayons ayez aient',pp:'eu'},
 'aller':{g:'to go',pres:'vais vas va allons allez vont',fut:'ir',subj:'aille ailles aille allions alliez aillent',pp:'allé',aux:1},
 'faire':{g:'to do, to make',pres:'fais fais fait faisons faites font',fut:'fer',subj:'fasse fasses fasse fassions fassiez fassent',pp:'fait'},
 'pouvoir':{g:'to be able to',pres:'peux|puis peux peut pouvons pouvez peuvent',fut:'pourr',subj:'puisse puisses puisse puissions puissiez puissent',pp:'pu'},
 'vouloir':{g:'to want',pres:'veux veux veut voulons voulez veulent',fut:'voudr',subj:'veuille veuilles veuille voulions vouliez veuillent',pp:'voulu'},
 'devoir':{g:'to have to, to owe',pres:'dois dois doit devons devez doivent',fut:'devr',pp:'dû'},
 'savoir':{g:'to know',pres:'sais sais sait savons savez savent',fut:'saur',subj:'sache saches sache sachions sachiez sachent',pp:'su'},
 'venir':{g:'to come',pres:'viens viens vient venons venez viennent',fut:'viendr',pp:'venu',aux:1},
 'tenir':{g:'to hold',pres:'tiens tiens tient tenons tenez tiennent',fut:'tiendr',pp:'tenu'},
 'prendre':{g:'to take',pres:'prends prends prend prenons prenez prennent',pp:'pris'},
 'mettre':{g:'to put',pres:'mets mets met mettons mettez mettent',pp:'mis'},
 'dire':{g:'to say',pres:'dis dis dit disons dites disent',pp:'dit'},
 'voir':{g:'to see',pres:'vois vois voit voyons voyez voient',fut:'verr',pp:'vu'},
 'partir':{g:'to leave',pres:'pars pars part partons partez partent',pp:'parti',aux:1},
 'sortir':{g:'to go out',pres:'sors sors sort sortons sortez sortent',pp:'sorti',aux:1},
 'dormir':{g:'to sleep',pres:'dors dors dort dormons dormez dorment',pp:'dormi'},
 'sentir':{g:'to feel, to smell',pres:'sens sens sent sentons sentez sentent',pp:'senti'},
 'croire':{g:'to believe',pres:'crois crois croit croyons croyez croient',pp:'cru'},
 'boire':{g:'to drink',pres:'bois bois boit buvons buvez boivent',pp:'bu'},
 'lire':{g:'to read',pres:'lis lis lit lisons lisez lisent',pp:'lu'},
 'écrire':{g:'to write',pres:'écris écris écrit écrivons écrivez écrivent',pp:'écrit'},
 'connaître':{g:'to know (be familiar with)',pres:'connais connais connaît connaissons connaissez connaissent',pp:'connu',rect:1},
 'naître':{g:'to be born',pres:'nais nais naît naissons naissez naissent',pp:'né',aux:1,rect:1},
 'vivre':{g:'to live',pres:'vis vis vit vivons vivez vivent',pp:'vécu'},
 'recevoir':{g:'to receive',pres:'reçois reçois reçoit recevons recevez reçoivent',fut:'recevr',pp:'reçu'},
 'ouvrir':{g:'to open',pres:'ouvre ouvres ouvre ouvrons ouvrez ouvrent',pp:'ouvert'},
 'offrir':{g:'to offer',pres:'offre offres offre offrons offrez offrent',pp:'offert'},
 'courir':{g:'to run',pres:'cours cours court courons courez courent',fut:'courr',pp:'couru'},
 'mourir':{g:'to die',pres:'meurs meurs meurt mourons mourez meurent',fut:'mourr',pp:'mort',aux:1},
 'suivre':{g:'to follow',pres:'suis suis suit suivons suivez suivent',pp:'suivi'},
 'conduire':{g:'to drive',pres:'conduis conduis conduit conduisons conduisez conduisent',pp:'conduit'},
};
function derive(base,prefix,extra){
  const b=IRR[base],px=s=>s.split(' ').map(t=>t.split('|').map(x=>prefix+x).join('|')).join(' ');
  const o={pres:px(b.pres),pp:prefix+b.pp};
  if(b.fut)o.fut=prefix+b.fut;if(b.imp)o.imp=prefix+b.imp;if(b.subj)o.subj=px(b.subj);
  return Object.assign(o,extra);
}
Object.assign(IRR,{
 'devenir':derive('venir','de',{g:'to become',aux:1}),'revenir':derive('venir','re',{g:'to come back',aux:1}),
 'obtenir':derive('tenir','ob',{g:'to obtain',aux:0}),'comprendre':derive('prendre','com',{g:'to understand'}),
 'apprendre':derive('prendre','ap',{g:'to learn'}),'permettre':derive('mettre','per',{g:'to allow'}),
});
const REG=[
 ['parler','to speak','er'],['aimer','to love, to like','er'],['travailler','to work','er'],['chanter','to sing','er'],
 ['regarder','to watch','er'],['écouter','to listen','er'],['donner','to give','er'],['trouver','to find','er'],
 ['penser','to think','er'],['demander','to ask','er'],['jouer','to play','er'],['oublier','to forget','er'],
 ['étudier','to study','er'],['arriver','to arrive','er','',1],['rester','to stay','er','',1],['entrer','to enter','er','',1],
 ['tomber','to fall','er','',1],['monter','to go up','er','',1],['rentrer','to go home','er','',1],
 ['manger','to eat','er','ger'],['nager','to swim','er','ger'],['voyager','to travel','er','ger'],['changer','to change','er','ger'],
 ['commencer','to begin','er','cer'],['lancer','to throw','er','cer'],['placer','to place','er','cer'],
 ['acheter','to buy','er','eg'],['lever','to raise','er','eg'],['promener','to walk (someone)','er','eg'],
 ['préférer','to prefer','er','ea'],['espérer','to hope','er','ea'],['répéter','to repeat','er','ea'],
 ['appeler','to call','er','dbl'],['jeter','to throw away','er','dbl'],
 ['payer','to pay','er','yer'],['essayer','to try','er','yer'],['nettoyer','to clean','er','yer'],
 ['employer','to use, to employ','er','yer'],['envoyer','to send','er','yer',0,'enverr'],
 ['finir','to finish','ir'],['choisir','to choose','ir'],['réussir','to succeed','ir'],
 ['grandir','to grow up','ir'],['réfléchir','to reflect','ir'],['obéir','to obey','ir'],
 ['vendre','to sell','re'],['attendre','to wait','re'],['répondre','to answer','re'],
 ['entendre','to hear','re'],['perdre','to lose','re'],['descendre','to go down','re','',1],
];
const verbs=[
 ...REG.map(([inf,g,cls,t,aux,fut])=>({inf,g,cls,t:t||'',aux:!!aux,fut,irr:false})),
 ...Object.entries(IRR).map(([inf,d])=>({inf,g:d.g,cls:'irr',aux:!!d.aux,d,irr:true})),
];
function build(v){
  const F={};
  if(v.cls==='er'){
    const st=v.inf.slice(0,-2),t=v.t;let strong=[st];
    if(t==='eg')strong=[lastRep(st,'e','è')];
    if(t==='ea')strong=[lastRep(st,'é','è')];
    if(t==='dbl')strong=[st+st.slice(-1)];
    if(t==='yer'){const s=st.slice(0,-1)+'i';strong=st.endsWith('ay')?[s,st]:[s]}
    const soft=e=>/^[ao]/.test(e)?(t==='ger'?st+'e':t==='cer'?st.slice(0,-1)+'ç':st):st;
    const S=(a,e)=>a.map(s=>s+e);
    F.pres=[S(strong,'e'),S(strong,'es'),S(strong,'e'),[soft('ons')+'ons'],[st+'ez'],S(strong,'ent')];
    F.imp=IMP.map(e=>[soft(e)+e]);
    F.subj=[S(strong,'e'),S(strong,'es'),S(strong,'e'),[st+'ions'],[st+'iez'],S(strong,'ent')];
    F.fut=v.fut?[v.fut]:['eg','dbl','yer'].includes(t)?S(strong,'er'):t==='ea'?[v.inf,strong[0]+'er']:[v.inf];
    F.pp=st+'é';
  }else if(v.cls==='ir'){
    const st=v.inf.slice(0,-2);
    F.pres=['is','is','it','issons','issez','issent'].map(e=>[st+e]);
    F.imp=IMP.map(e=>[st+'iss'+e]);F.subj=SUBJ.map(e=>[st+'iss'+e]);F.fut=[v.inf];F.pp=st+'i';
  }else if(v.cls==='re'){
    const st=v.inf.slice(0,-2);
    F.pres=['s','s','','ons','ez','ent'].map(e=>[st+e]);
    F.imp=IMP.map(e=>[st+e]);F.subj=SUBJ.map(e=>[st+e]);F.fut=[v.inf.slice(0,-1)];F.pp=st+'u';
  }else{
    const d=v.d,p=d.pres.split(' ');F.pres=p.map(alts);
    const nous=alts(p[3])[0],ils=alts(p[5])[0],imp=d.imp||nous.slice(0,-3);
    F.imp=IMP.map(e=>[imp+e]);
    if(d.subj)F.subj=d.subj.split(' ').map(alts);
    else{const s1=ils.slice(0,-3),s2=nous.slice(0,-3);F.subj=SUBJ.map((e,i)=>[(i===3||i===4?s2:s1)+e])}
    F.fut=[d.fut||(v.inf.endsWith('re')?v.inf.slice(0,-1):v.inf)];F.pp=d.pp;
  }
  return F;
}
const cache=new Map(),forms=v=>{if(!cache.has(v.inf))cache.set(v.inf,build(v));return cache.get(v.inf)};
const byInf=i=>verbs.find(v=>v.inf===i);
function simple(v,k,pi){
  const F=forms(v);
  if(k==='fut')return F.fut.map(s=>s+FUT[pi]);
  if(k==='cond')return F.fut.map(s=>s+IMP[pi]);
  return F[k][pi];
}
function agree(pp,pi,fem,etre){
  if(!etre)return[pp];const pl=pp.endsWith('s')?pp:pp+'s';
  return[[pp,pp+'e'],[pp,pp+'e'],fem?[pp+'e']:[pp],[pl,pp+'es'],[pl,pp,pp+'e',pp+'es'],fem?[pp+'es']:[pl]][pi];
}
const COMP={pc:'pres',pqp:'imp',fa:'fut',cp:'cond'};
function answers(v,k,pi,fem){
  let out;
  if(COMP[k]){const a=simple(byInf(v.aux?'être':'avoir'),COMP[k],pi),pps=agree(forms(v).pp,pi,fem,v.aux);out=a.flatMap(x=>pps.map(p=>x+' '+p))}
  else out=simple(v,k,pi).slice();
  if(v.d&&v.d.rect)out=[...out,...out.map(a=>a.replace(/î(?=t)/g,'i'))];
  return[...new Set(out)];
}
function pronoun(k,pi,fem,first){
  let p=['je','tu',fem?'elle':'il','nous','vous',fem?'elles':'ils'][pi];
  if(pi===0&&/^[aeiouhéèêâîôûy]/.test(first))p="j'";
  if(k==='subj')p=(/^[ie]/.test(p)?"qu'":'que ')+p;
  return p;
}
return{
  name:'français',short:'fr',verbs,answers,pronoun,
  gender:pi=>(pi===2||pi===5)&&Math.random()<.5,
  note:(v,k)=>COMP[k]&&v.aux?'être':'',
  tenses:[['pres','présent','présent'],['imp','imparfait','imparfait'],['fut','futur','futur simple'],['cond','conditionnel','conditionnel présent'],
    ['subj','subjonctif','subjonctif présent'],['pc','passé composé','passé composé'],['pqp','plus-que-parfait','plus-que-parfait'],
    ['fa','futur antérieur','futur antérieur'],['cp','cond. passé','conditionnel passé']],
  defTenses:['pres','imp','fut','cond','subj','pc'],
  prons:['je','tu','il','nous','vous','ils'],
  keys:['é','è','ê','ç','à','î','û','ô','œ'],
  arts:/^(le |la |les |l'|un |une )/,
  strip:/^((que |qu')?(je |j'|tu |il |elle |on |nous |vous |ils |elles ))/,
};
})();

/* ================= SPANISH ================= */
const ES=(()=>{
const PR={ar:['o','as','a','amos','áis','an'],er:['o','es','e','emos','éis','en'],ir:['o','es','e','imos','ís','en']};
const PT={ar:['é','aste','ó','amos','asteis','aron'],er:['í','iste','ió','imos','isteis','ieron']};PT.ir=PT.er;
const IM={ar:['aba','abas','aba','ábamos','abais','aban'],er:['ía','ías','ía','íamos','íais','ían']};IM.ir=IM.er;
const SB={ar:['e','es','e','emos','éis','en'],er:['a','as','a','amos','áis','an']};SB.ir=SB.er;
const FU=['é','ás','á','emos','éis','án'],CO=['ía','ías','ía','íamos','íais','ían'];
const sp=s=>s.split(' ');
const IRR={
 ser:{g:'to be (permanent)',pres:'soy eres es somos sois son',pret:'fui fuiste fue fuimos fuisteis fueron',imp:'era eras era éramos erais eran',subj:'sea seas sea seamos seáis sean',pp:'sido'},
 estar:{g:'to be (state, location)',pres:'estoy estás está estamos estáis están',pret:'estuve estuviste estuvo estuvimos estuvisteis estuvieron',subj:'esté estés esté estemos estéis estén'},
 ir:{g:'to go',pres:'voy vas va vamos vais van',pret:'fui fuiste fue fuimos fuisteis fueron',imp:'iba ibas iba íbamos ibais iban',subj:'vaya vayas vaya vayamos vayáis vayan'},
 tener:{g:'to have',pres:'tengo tienes tiene tenemos tenéis tienen',pret:'tuve tuviste tuvo tuvimos tuvisteis tuvieron',fut:'tendr'},
 hacer:{g:'to do, to make',pres:'hago haces hace hacemos hacéis hacen',pret:'hice hiciste hizo hicimos hicisteis hicieron',fut:'har',pp:'hecho'},
 poder:{g:'to be able to',pres:'puedo puedes puede podemos podéis pueden',pret:'pude pudiste pudo pudimos pudisteis pudieron',fut:'podr',subj:'pueda puedas pueda podamos podáis puedan'},
 querer:{g:'to want, to love',pres:'quiero quieres quiere queremos queréis quieren',pret:'quise quisiste quiso quisimos quisisteis quisieron',fut:'querr',subj:'quiera quieras quiera queramos queráis quieran'},
 decir:{g:'to say',pres:'digo dices dice decimos decís dicen',pret:'dije dijiste dijo dijimos dijisteis dijeron',fut:'dir',pp:'dicho'},
 venir:{g:'to come',pres:'vengo vienes viene venimos venís vienen',pret:'vine viniste vino vinimos vinisteis vinieron',fut:'vendr'},

/* ---------- sound ---------- */
let AC,master,rev,noise;
function audio(){
  if(cfg.sound==='off')return null;
  if(!AC){
    try{
      AC=new(window.AudioContext||window.webkitAudioContext)();
      const comp=AC.createDynamicsCompressor();comp.connect(AC.destination);
      master=AC.createGain();master.gain.value=.55;master.connect(comp);
      rev=AC.createConvolver();const len=AC.sampleRate*2.6,ir=AC.createBuffer(2,len,AC.sampleRate);
      for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4)}
      rev.buffer=ir;const wet=AC.createGain();wet.gain.value=.32;rev.connect(wet);wet.connect(comp);
      noise=AC.createBuffer(1,AC.sampleRate*.08,AC.sampleRate);const nd=noise.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    }catch(e){AC=null;return null}
  }
  if(AC.state==='suspended')AC.resume();return AC;
}
function env(g,t,peak,a,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function click(back){
  if(cfg.sound!=='all')return;const a=audio();if(!a)return;const t=a.currentTime;
  const s=a.createBufferSource();s.buffer=noise;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=(back?1100:1700)+Math.random()*400;
  const g=a.createGain();env(g,t,.14,.002,.035);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+.07);
  const o=a.createOscillator();o.type='sine';o.frequency.setValueAtTime((back?110:150)+Math.random()*25,t);o.frequency.exponentialRampToValueAtTime(65,t+.05);
  const g2=a.createGain();env(g2,t,.1,.002,.05);o.connect(g2);g2.connect(master);o.start(t);o.stop(t+.08);
}
function bell(freq,delay,vol){
  const a=audio();if(!a)return;const t=a.currentTime+delay;
  [[1,1],[2,.2],[3.01,.05]].forEach(([m,v])=>{const o=a.createOscillator();o.type='sine';o.frequency.value=freq*m;
    const g=a.createGain();env(g,t,vol*v,.01,m===1?1.4:.6);o.connect(g);g.connect(master);g.connect(rev);o.start(t);o.stop(t+1.6)});
}
const chime=()=>{bell(587.33,0,.11);bell(880,.09,.08)};
const milestone=()=>[440,554.37,659.25,880,1108.7].forEach((f,i)=>bell(f,i*.09,.07));
function miss(quiet){
  const a=audio();if(!a)return;const t=a.currentTime;
  const o=a.createOscillator();o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(174,t+.22);
  const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=700;const g=a.createGain();env(g,t,quiet?.07:.13,.012,.45);
  o.connect(f);f.connect(g);g.connect(master);g.connect(rev);o.start(t);o.stop(t+.6);
}

function sizeInput(){inp.style.width=Math.max(9,inp.value.length+1)+'ch'}

function pickVerb(){
  const l=L(),p=P();
  const d=cfg.diff.verbs;
  let pool=l.verbs.filter(v=>d==='medium'||(d==='hard')===v.irr);
  if(!pool.length)pool=l.verbs;
  if(pool.length>1)pool=pool.filter(v=>v.inf!==last);
  const v=pick1(pool),pi=pick1(p.pron);
  buildVerb({inf:v.inf,k:pick1(p.tenses),pi,g:l.gender(pi)});
}
function buildVerb(sp){
  const l=L(),v=l.verbs.find(x=>x.inf===sp.inf);if(!v)return false;
  const {k,pi,g}=sp,ans=l.answers(v,k,pi,g),t=l.tenses.find(x=>x[0]===k),n=l.note(v,k);
  q={ans,spec:sp,kicker:t[2],prompt:v.inf,gloss:v.g+(n?'  ·  '+n:''),pron:l.pronoun(k,pi,g,ans[0])};return true;
}
function pickWord(){
  const lk=cfg.lang,w=cfg.words,toEn=w.dir==='to-en';
  const lv=DIFFS.indexOf(cfg.diff.words)+1;
  let pool=VOCAB.filter(x=>w.cats.includes(x.cat)&&x.lvl===lv);
  if(!pool.length)pool=VOCAB.filter(x=>w.cats.includes(x.cat));
  if(pool.length>1)pool=pool.filter(x=>x.en[0]!==last);
  buildWord({en:pick1(pool).en[0]});
}
function buildWord(sp){
  const lk=cfg.lang,w=cfg.words,toEn=w.dir==='to-en',x=VOCAB.find(y=>y.en[0]===sp.en);if(!x)return false;
  const ans=toEn?x.en:x[lk],art=!toEn&&w.articles==='required'&&ans.some(a=>L().arts.test(a.toLowerCase()));
  q={ans,word:true,toEn,kicker:x.cat+(art?'  ·  with article':''),prompt:toEn?x[lk][0]:x.en[0],
    gloss:toEn?'into english':'into '+L().name,pron:'',spec:sp};return true;
}
const specId=sp=>sp.inf?[sp.inf,sp.k,sp.pi,sp.g].join(':'):sp.en;
function validSpec(sp){
  if(W()){const x=VOCAB.find(y=>y.en[0]===sp.en);return !!x&&cfg.words.cats.includes(x.cat)}
  return P().tenses.includes(sp.k)&&P().pron.includes(sp.pi);
}
function pick(){
  const key=statKey(),n=cfg.qn[key]=(cfg.qn[key]||0)+1,R=cfg.review[key]||(cfg.review[key]=[]);
  const due=R.filter(r=>r.due<=n&&validSpec(r.spec)&&specId(r.spec)!==last).sort((a,b)=>a.due-b.due);
  if(!(due.length&&(W()?buildWord(due[0].spec):buildVerb(due[0].spec))))W()?pickWord():pickVerb();
  else q.rev=due[0];

}
function schedule(){
  const key=statKey(),R=cfg.review[key]||(cfg.review[key]=[]),id=specId(q.spec);
  let r=q.rev||R.find(x=>specId(x.spec)===id);
  if(!r){r={spec:q.spec};R.push(r);if(R.length>60)R.shift()}
  r.hits=0;r.due=cfg.qn[key]+3+Math.floor(Math.random()*3);save();

function reviewed(){
  if(!q.rev)return;const key=statKey(),R=cfg.review[key];
  q.rev.hits=(q.rev.hits||0)+1;
  if(q.rev.hits>=2){const i=R.indexOf(q.rev);if(i>=0)R.splice(i,1)}

  $('sAcc').textContent=s.total?Math.round(s.ok/s.total*100)+'%':'–';
  if(s.streak>(cfg.best[k]||0)){cfg.best[k]=s.streak;save()}
  $('sBest').textContent=cfg.best[k]||0;
  $('sRev').textContent=(cfg.review[k]||[]).length;
}
function shake(){row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake')}
function submit(){
  const u=T(inp.value,1);if(!u){shake();return}
  const A=q.ans.map(a=>[a,T(a)]);
  const s=S(),exact=A.find(([,n])=>n===u),near=A.find(([,n])=>bare(n)===bare(u)),good=exact||(near&&cfg.accents==='lenient');
  s.total++;
  if(good){
    s.ok++;s.streak++;row.classList.add('ok');reviewed();
    if(!exact)fb.innerHTML=diff(near[0],clean(inp.value))+'<span class="tag">accents</span>';
    s.streak%10===0?milestone():chime();updateStats();state='lock';setTimeout(next,exact?560:1150);
  }else{
    s.streak=0;row.classList.add('bad');shake();miss();schedule();
    const target=(near||A[0])[0];
    let tag=near?'watch the accents':'';
    if(!near&&q.word&&!q.toEn&&A.some(([,n])=>n.replace(L().arts,'')===u))tag='article';
    fb.innerHTML=diff(target,clean(inp.value))+(tag?`<span class="tag">${tag}</span>`:'');
    inp.readOnly=true;state='done';updateStats();
  }
}
function reveal(){const s=S();s.total++;s.streak=0;schedule();updateStats();miss(true);fb.innerHTML=q.ans[0];inp.readOnly=true;state='done'}

inp.addEventListener('input',sizeInput);
inp.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closePanel();return}
  document.body.classList.add('typing');
  if(e.key==='Enter'){e.preventDefault();if(state==='ask')submit();else if(state==='done')next();return}
  if(e.key==='Tab'){e.preventDefault();if(state==='ask')reveal();else if(state==='done')next();return}
  if(state!=='ask'){if(e.key.length===1||e.key==='Backspace')e.preventDefault();return}
  if(typingTarget()&&/^[1-9]$/.test(e.key)&&!e.ctrlKey&&!e.metaKey){e.preventDefault();const c=L().keys[+e.key-1];if(c)insert(c);return}
  if(e.key==='Backspace')click(true);else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey)click();
});
document.addEventListener('mousemove',()=>document.body.classList.remove('typing'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();else if(document.activeElement!==inp&&(e.key.length===1||e.key==='Enter'))inp.focus()});
document.addEventListener('click',e=>{if(!e.target.closest('button')&&!e.target.closest('.panel')){closePanel();inp.focus()}});

renderAll();pick();show();inp.focus();
</script>
